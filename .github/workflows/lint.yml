name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    # macOS runner: checks syntax against the same /bin/bash 3.2 the scripts run on
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: brew install shellcheck
      - name: shellcheck
        run: shellcheck cswitch claude-usage.2m.sh install.sh
      - name: bash 3.2 syntax
        run: for f in cswitch claude-usage.2m.sh install.sh; do /bin/bash -n "$f"; done
